name: CI/CD Build & Deploy to BigRock

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js and enable dependency caching
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run Linter (Ensure code quality checks pass)
      - name: Run Lint
        run: npm run lint

      # Step 5: Build the production bundle
      - name: Build production bundle
        run: npm run build

      # Step 6: Deploy to BigRock server using FTP/SFTP
      # This action syncs only modified files (incremental sync) which mimics corporate CD efficiency
      - name: Deploy to BigRock Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BIGROCK_FTP_SERVER }}
          username: ${{ secrets.BIGROCK_FTP_USERNAME }}
          password: ${{ secrets.BIGROCK_FTP_PASSWORD }}
          port: ${{ secrets.BIGROCK_FTP_PORT || 21 }} # SFTP is typically 22, FTP is 21
          local-dir: ./dist/
          server-dir: ${{ secrets.BIGROCK_FTP_SERVER_DIR || './public_html/' }}
          protocol: ${{ secrets.BIGROCK_FTP_PROTOCOL || 'ftp' }} # Can be 'ftp', 'ftps', or 'sftp'
          # To keep backend PHP files (like contact-submit.php and voice-call.php) on the server intact:
          dangerous-clean-slate: false 
